[project]
name = "ecovision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Chethan-Kumar-K", email = "chethankumark1204@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "python-multipart>=0.0.34",
    "rasterio>=1.5.2",
    "segmentation-models-pytorch>=0.6.0",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
ecovision = "ecovision:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
